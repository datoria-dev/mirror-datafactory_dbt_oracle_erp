[project]
name = "esbi"
version = "0.1.0"
description = "dbt project dependencies for Oracle ERP analytics engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black>=25.12.0",
    "dbt-colibri>=0.3.5",
    "dbt-core>=1.10,<1.11",
    "dbt-oracle>=1.10,<1.11",
    "ruff>=0.15.4",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "ruff>=0.15.4",
]

[tool.uv]
package = false
