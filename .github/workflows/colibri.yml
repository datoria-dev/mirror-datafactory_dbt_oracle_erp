name: colibri dashboard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt Colibri
        run: python -m pip install dbt-colibri

      - name: Build dashboard
        env:
          PYTHONIOENCODING: utf-8
        run: colibri generate --manifest target/manifest.json --catalog target/catalog.json --output-dir dist --disable-telemetry

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: colibri-dashboard
          path: dist
