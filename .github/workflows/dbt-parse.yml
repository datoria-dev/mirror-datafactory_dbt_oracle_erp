name: dbt parse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    env:
      DBT_ORACLE_HOST: localhost
      DBT_ORACLE_PORT: "1521"
      DBT_ORACLE_USER: ci_user
      DBT_ORACLE_PASSWORD: ci_password
      DBT_ORACLE_SERVICE: ci_service
      DBT_ORACLE_SCHEMA: ci_schema
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install dbt-core==1.8.9 dbt-oracle==1.8.3

      - name: Parse dbt project
        run: dbt parse --profiles-dir .
